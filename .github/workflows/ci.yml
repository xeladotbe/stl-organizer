name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # `npm ci`'s postinstall (`electron-builder install-app-deps`) rebuilds native modules
      # (better-sqlite3) against Electron's Node ABI, not the plain Node.js this CI runner's
      # `vitest` workers use - loading that Electron-targeted binary under plain Node crashes the
      # worker process outright ("Worker exited unexpectedly"), not a normal test failure. Rebuild
      # it back to the runner's own Node ABI before running tests.
      - run: npm rebuild better-sqlite3

      - run: npm run test
