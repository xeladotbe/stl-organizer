name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
          - os: macos-latest
            build-script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm run ${{ matrix.build-script }}
        env:
          # No Apple Developer / Windows code-signing certificates are configured for this
          # project, so build unsigned artifacts rather than letting electron-builder fail
          # looking for a signing identity that doesn't exist.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # CHANGELOG.md accumulates one `## v...` section per release - the whole file was fine as
      # the release body when v0.0.1 was the only section, but would dump the entire history into
      # every release body from here on. Extract just the top-most section instead.
      - name: Extract this release's changelog section
        shell: bash
        run: awk '/^## /{if (found) exit; found=1} found' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
